name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (root + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/e2e-linux.sh

  e2e-macos:
    name: E2E (macOS)
    runs-on: macos-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # node-pty prebuild 无 darwin-arm64（上游 #850 系列）：强制源码编译 arm64 原生模块
      - name: Build node-pty from source (arm64)
        run: |
          echo "arch: $(node -p process.arch)"
          npm rebuild node-pty --build-from-source 2>&1 | tail -5
          echo "--- build 产物 ---"
          ls -la node_modules/node-pty/build/Release/ 2>/dev/null || echo "(无 build/Release)"
      - run: bash tests/e2e-linux.sh

  diagnose-macos-arm64:
    name: Diagnose (macOS arm64)
    runs-on: macos-14
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: node-pty arm64 编译产物诊断
        run: |
          echo "arch: $(node -p process.arch)"
          echo "--- node-pty 原生产物 ---"
          find node_modules/node-pty -name "*.node" -o -name "spawn-helper" | head -10
          echo "--- build/Release ---"
          ls node_modules/node-pty/build/Release/ 2>/dev/null || echo "(无 build/Release)"
          echo "--- out/ ---"
          ls node_modules/node-pty/out/Release/ 2>/dev/null || echo "(无 out/)"
          echo "--- 直接加载测试 ---"
          node -e "
            const pty = require('node-pty');
            const p = pty.spawn('/bin/sh', ['-c', 'echo spawn-test'], { name: 'xterm', cols: 80, rows: 24 });
            p.onData((d) => process.stdout.write(d));
            p.onExit(({ exitCode }) => { console.log('exit:', exitCode); process.exit(exitCode === 0 ? 0 : 1); });
            setTimeout(() => { console.error('TIMEOUT'); process.exit(1); }, 8000);
          "

  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/tmon.js "echo windows-smoke && exit 0"
      - run: node bin/tmon.js ls
