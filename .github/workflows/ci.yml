name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (root + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/e2e-linux.sh

  e2e-macos:
    name: E2E (macOS)
    runs-on: macos-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # node-pty#850：npm tarball 中 spawn-helper 丢失执行位 → macOS posix_spawnp failed
      # 验证：chmod +x 后重跑 e2e；若通过则正式方案改为 postinstall 修复脚本
      - name: Fix node-pty spawn-helper exec bit (workaround)
        run: |
          SH=$(find node_modules/node-pty -name "spawn-helper" -type f | head -1)
          echo "spawn-helper: $SH"
          ls -l "$SH" 2>/dev/null || echo "spawn-helper 未找到（则非此原因）"
          chmod +x "$SH" 2>/dev/null || true
      - run: bash tests/e2e-linux.sh

  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/tmon.js "echo windows-smoke && exit 0"
      - run: node bin/tmon.js ls
