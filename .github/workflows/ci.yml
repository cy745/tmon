name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (root + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/e2e-linux.sh

  e2e-macos:
    name: E2E (macOS)
    runs-on: macos-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # macOS arm64 修复：node-pty 1.1.0 的 prebuild 为 darwin-x64，arm64 runner 上
      # spawn-helper 架构不匹配 → posix_spawnp failed。强制源码编译 arm64 原生模块。
      - name: Rebuild node-pty for native arch (arm64)
        run: |
          echo "runner arch: $(node -p process.arch)"
          ls node_modules/node-pty/prebuilds/ 2>/dev/null || true
          npm rebuild node-pty 2>&1 | tail -3
          SH=$(find node_modules/node-pty -name "spawn-helper" -type f | head -1)
          echo "rebuilt spawn-helper: $SH"
          ls -l "$SH" 2>/dev/null || true
          chmod +x "$SH" 2>/dev/null || true
      - run: bash tests/e2e-linux.sh

  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/tmon.js "echo windows-smoke && exit 0"
      - run: node bin/tmon.js ls
