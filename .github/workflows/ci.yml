name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (root + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - working-directory: web
        run: |
          npm ci
          npx tsc --noEmit

  e2e-linux:
    name: E2E (Linux)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tests/e2e-linux.sh

  e2e-macos:
    name: E2E (macOS)
    runs-on: macos-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # node-pty prebuild 无 darwin-arm64（上游 #850 系列）：强制源码编译 arm64 原生模块
      - name: Build node-pty from source (arm64)
        run: npm rebuild node-pty --build-from-source 2>&1 | tail -3
      - run: bash tests/e2e-linux.sh

  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node bin/tmon.js "echo windows-smoke && exit 0"
      - run: node bin/tmon.js ls
